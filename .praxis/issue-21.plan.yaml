tasks:
- id: task-perf-fix
  title: 'Multi-session perf: lazy lifecycle, hibernation, concurrency limit, backpressure,
    skip render'
  objective: Fix 5 performance issues causing UI blocking under multi-session gateway
    load.
  implementation:
    instructions:
    - Remove _schedule_agent_build(sid) from session.create handler
    - Remove _schedule_agent_build(sid) from session.resume cold path
    - Add HIBERNATE_IDLE_S=60 constant and _hibernate_idle_session() that closes agent+worker
      but preserves session dict
    - Modify _reap_idle_sessions to hibernate idle live-transport sessions
    - Add MAX_CONCURRENT_AGENT_TURNS=2 and _active_agent_turns set with _try_acquire_concurrent_turn()
      helper
    - Add concurrent turn guard in prompt.submit, _drain_queued_prompt, goal-followup,
      and notification drain paths
    - Skip StreamingRenderer.feed() for WSTransport sessions in _stream callback —
      WS only uses payload.text
    - All error paths properly release concurrent turn slots
    antiPatterns:
    - Do not break running/streaming sessions with hibernation
    - Do not block stop/interrupt/approval control messages with concurrency limit
    - Do not lose transcript history during hibernate/rebuild cycle
    - Do not remove final rendering for any transport
